name: Godot Project Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download Godot 4.7.2
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
      - name: Import project and fail on script errors
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --quit 2>&1 | tee godot-import.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|ERROR:" godot-import.log; then
            echo "Godot reported script or resource errors during import."
            exit 1
          fi
      - name: Run gameplay scene and fail on script errors
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --quit-after 600 -- --test-gameplay 2>&1 | tee godot-runtime.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|ERROR:" godot-runtime.log; then
            echo "Godot reported script or resource errors while running the main scene."
            exit 1
          fi
