name: Godot Project Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download Godot 4.5.1
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.5.1-stable_linux.x86_64.zip
          chmod +x Godot_v4.5.1-stable_linux.x86_64
      - name: Import project
        run: ./Godot_v4.5.1-stable_linux.x86_64 --headless --editor --path . --quit
      - name: Run gameplay scene headlessly
        run: ./Godot_v4.5.1-stable_linux.x86_64 --headless --path . --quit-after 180
