name: Build Zeka City Cleanup Empire Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build_android:
    name: Export Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages (retry corrupted NDK downloads)
        shell: bash
        run: |
          set -euo pipefail
          PACKAGES=(
            "platform-tools"
            "platforms;android-35"
            "build-tools;35.0.1"
            "cmdline-tools;latest"
            "cmake;3.10.2.4988404"
            "ndk;28.1.13356709"
          )
          for attempt in 1 2 3; do
            echo "Android SDK installation attempt $attempt/3"
            # A failed Google SDK download can leave a truncated archive in the local cache.
            rm -rf "$HOME/.android/cache" "$ANDROID_HOME/ndk/28.1.13356709"
            if yes | sdkmanager --install "${PACKAGES[@]}"; then
              test -d "$ANDROID_HOME/ndk/28.1.13356709"
              echo "Android SDK packages and NDK installed successfully."
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "SDK installation failed; clearing partial files and retrying in 15 seconds."
              sleep 15
            fi
          done
          echo "Android SDK installation failed after 3 clean attempts."
          exit 1

      - name: Download Godot editor
        shell: bash
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.5.1-stable_linux.x86_64.zip
          chmod +x Godot_v4.5.1-stable_linux.x86_64
          echo "GODOT_BIN=$PWD/Godot_v4.5.1-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Install matching Android export templates
        shell: bash
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.5.1.stable"
          unzip -q Godot_v4.5.1-stable_export_templates.tpz -d /tmp/godot-templates
          cp -R /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.5.1.stable/"
          test -s "$HOME/.local/share/godot/export_templates/4.5.1.stable/android_source.zip"

      - name: Configure permanent release signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing secret: ANDROID_KEYSTORE_BASE64. Run Prepare Trash Empire Release Signing Key and add the generated secrets." && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "Missing secret: ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "Missing secret: ANDROID_KEY_ALIAS" && exit 1)
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode --ignore-garbage > "$RUNNER_TEMP/trash-empire-release.keystore"
          test -s "$RUNNER_TEMP/trash-empire-release.keystore"
          keytool -list -keystore "$RUNNER_TEMP/trash-empire-release.keystore" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$RUNNER_TEMP/trash-empire-release.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Configure Godot Android SDK and Java paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$JAVA_HOME"

      - name: Import resources
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          timeout 240 "$GODOT_BIN" --headless --editor --verbose --path . --quit

      - name: Validate GDScript and startup scene
        shell: bash
        run: |
          set -euo pipefail
          LOG_FILE="$RUNNER_TEMP/godot-validation.log"
          "$GODOT_BIN" --headless --editor --path . --quit 2>&1 | tee "$LOG_FILE"
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|ERROR: Failed to load" "$LOG_FILE"; then
            echo "Godot reported script or scene loading errors."
            exit 1
          fi
          "$GODOT_BIN" --headless --path . --quit-after 3 2>&1 | tee "$RUNNER_TEMP/godot-startup.log"
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|ERROR: Failed to load" "$RUNNER_TEMP/godot-startup.log"; then
            echo "Main scene failed during startup."
            exit 1
          fi

      - name: Export debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          "$GODOT_BIN" --headless --verbose --path . --install-android-build-template --export-release "Android Release APK" build/TrashEmpire.apk
          test -s build/TrashEmpire.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zeka-City-Cleanup-Empire-Android-APK
          path: build/TrashEmpire.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: Zeka City Cleanup Empire Android Build ${{ github.run_number }}
          make_latest: true
          files: build/TrashEmpire.apk
          fail_on_unmatched_files: true
