name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build_android:
    name: Export Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.1" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;28.1.13356709"

      - name: Download Godot editor
        shell: bash
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.5.1-stable_linux.x86_64.zip
          chmod +x Godot_v4.5.1-stable_linux.x86_64
          echo "GODOT_BIN=$PWD/Godot_v4.5.1-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Install matching Android export templates
        shell: bash
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.5.1.stable"
          unzip -q Godot_v4.5.1-stable_export_templates.tpz -d /tmp/godot-templates
          cp -R /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.5.1.stable/"
          test -s "$HOME/.local/share/godot/export_templates/4.5.1.stable/android_source.zip"

      - name: Create temporary debug signing key
        shell: bash
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Start Android Debug Bridge
        shell: bash
        run: |
          set -euo pipefail
          adb start-server
          adb devices

      - name: Import resources and install Android Gradle build template
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --editor --path . --install-android-build-template --quit
          test -f android/build/build.gradle

      - name: Export debug APK
        shell: bash
        run: |
          mkdir -p build
          "$GODOT_BIN" --headless --path . --export-debug "Android Debug" build/TrashEmpire.apk
          test -s build/TrashEmpire.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Trash-Empire-Android-APK
          path: build/TrashEmpire.apk
          if-no-files-found: error
          retention-days: 30
