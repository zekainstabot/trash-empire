name: 'انتشار Zeka City: Cleanup Empire (APK + AAB)'

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - export_presets.cfg
      - project.godot
      - Scripts/**
      - .github/workflows/android-store-release.yml

permissions:
  contents: write

jobs:
  build_release:
    name: 'Build, sign, and publish Zeka City: Cleanup Empire'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.1" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;28.1.13356709"
          yes | sdkmanager --licenses || true

      - name: Download Godot 4.5.1 and matching export templates
        shell: bash
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.5.1-stable_linux.x86_64.zip
          chmod +x Godot_v4.5.1-stable_linux.x86_64
          echo "GODOT_BIN=$PWD/Godot_v4.5.1-stable_linux.x86_64" >> "$GITHUB_ENV"
          wget -q https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.5.1.stable"
          unzip -q Godot_v4.5.1-stable_export_templates.tpz -d /tmp/godot-templates
          cp -R /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.5.1.stable/"
          test -s "$HOME/.local/share/godot/export_templates/4.5.1.stable/android_source.zip"

      - name: Configure permanent release signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing secret: ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "Missing secret: ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "Missing secret: ANDROID_KEY_ALIAS" && exit 1)
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode --ignore-garbage > "$RUNNER_TEMP/trash-empire-release.keystore"
          test -s "$RUNNER_TEMP/trash-empire-release.keystore"
          keytool -list -keystore "$RUNNER_TEMP/trash-empire-release.keystore" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$RUNNER_TEMP/trash-empire-release.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Configure Godot Android SDK and Java paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$JAVA_HOME"

      - name: Import resources
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          echo "Starting Godot resource import"
          timeout 240 "$GODOT_BIN" --headless --editor --verbose --path . --quit
          echo "Godot resource import completed"

      - name: Diagnose Android export preset configuration
        shell: bash
        run: |
          set +e
          mkdir -p build
          "$GODOT_BIN" --headless --verbose --path . --install-android-build-template --export-release "Android Release APK" build/TrashEmpire-release.apk 2>&1 | tee build/android-export-diagnostics.log
          export_status=${PIPESTATUS[0]}
          echo "Godot export exit code: $export_status"
          echo "---- Android export diagnostics ----"
          grep -Ein -C 5 "error|invalid|missing|not found|keystore|sdk|jdk|gradle|template|preset|warning" build/android-export-diagnostics.log | tail -n 240 || true
          if [ "$export_status" -ne 0 ]; then
            exit "$export_status"
          fi
          test -s build/TrashEmpire-release.apk
          jarsigner -verify -verbose -certs build/TrashEmpire-release.apk

      - name: Export signed AAB for Google Play
        shell: bash
        run: |
          "$GODOT_BIN" --headless --verbose --path . --export-release "Android Release AAB" build/TrashEmpire-release.aab
          test -s build/TrashEmpire-release.aab
          jarsigner -verify -verbose -certs build/TrashEmpire-release.aab

      - name: Upload signed store packages
        uses: actions/upload-artifact@v4
        with:
          name: Zeka-City-Cleanup-Empire-Store-Release
          path: |
            build/TrashEmpire-release.apk
            build/TrashEmpire-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 'Zeka City: Cleanup Empire v1.0.${{ github.run_number }}'
          generate_release_notes: true
          files: |
            build/TrashEmpire-release.apk
            build/TrashEmpire-release.aab
